var DM={};for(var i=0;i<days.length;i++)DM[days[i].id]=days[i];

function renderItems(items,dc){
  var h="";
  for(var j=0;j<items.length;j++){
    var it=items[j],last=(j===items.length-1);
    if(it.type==="note"){
      h+='<div class="tl-item">'+
        '<div class="tl-left"><span class="tl-time">'+it.time+'</span>'+(last?'':'<div class="tl-vline"></div>')+'</div>'+
        '<div class="tl-dot-col"><div class="tl-dot" style="background:'+dc+';opacity:.4"></div></div>'+
        '<div class="tl-content" style="padding:.05rem 0 .65rem 8px">'+
          '<div style="font-size:13px;color:#555;line-height:1.5">'+it.text+mkTags(it.tags||[])+'</div>'+
          (it.sub?'<div style="font-size:11px;color:#aaa;margin-top:2px">'+it.sub+'</div>':'')+
        '</div>'+
      '</div>';
    } else {
      var hasT=it.transport&&it.transport.mode&&!last;
      h+='<div class="tl-item">'+
        '<div class="tl-left"><span class="tl-time">'+it.arrive+'</span>'+(last?'':'<div class="tl-vline"></div>')+'</div>'+
        '<div class="tl-dot-col"><div class="tl-dot" style="background:'+dc+'"></div></div>'+
        '<div class="tl-content" style="padding:.05rem 0 .8rem 8px">'+
          '<div class="place-block">'+
            '<div class="place-name">'+it.name+'</div>'+
            (it.tags&&it.tags.length?'<div class="place-tags">'+mkTags(it.tags)+'</div>':'')+
            (it.note?'<div class="place-note">'+it.note+'</div>':'')+
            (it.stay?'<div class="place-meta">'+
              '<div class="meta-item"><span>⏱</span><span>停留 '+it.stay+'</span></div>'+
              (it.depart&&it.depart!=="—"?'<div class="meta-item"><span>🚪</span><span>約 '+it.depart+' 離開</span></div>':'')+
            '</div>':'')+
            (hasT?'<div class="meta-depart"><strong>→ 前往：</strong>'+it.transport.mode+(it.transport.line?' 「'+it.transport.line+'」':'')+(it.transport.min&&it.transport.min!=="（已含）"?' · 約 '+it.transport.min:'')+'</div>':'')+
          '</div>'+
        '</div>'+
      '</div>';
    }
  }
  return h;
}

function renderDay(d){
  var clH="";
  for(var k=0;k<d.cl.length;k++){
    clH+='<label class="ci" id="ci'+d.id+'-'+k+'"><input type="checkbox" onchange="ck(\''+d.id+'\','+k+')"><span>'+d.cl[k]+'</span></label>';
  }
  return'<div class="card">'+
    '<div class="hdr" onclick="toggle(\''+d.id+'\')">'+
      '<div class="bdg" style="'+d.bc+'">'+d.date+'<br>'+d.lbl+'</div>'+
      '<div class="dt"><h3>'+d.title+'</h3><p>'+d.city+'</p></div>'+
      '<span class="chv" id="c'+d.id+'">▼</span>'+
    '</div>'+
    '<div class="body" id="b'+d.id+'">'+
      '<div class="sec"><div class="lbl">行程時間軸</div><div class="tl">'+renderItems(d.items,d.dc)+'</div></div>'+
      '<div class="sep"></div>'+
      '<div class="sec">'+
        '<div class="cl-header lbl"><span>Check list</span><span class="cl-count" id="pc'+d.id+'">0/'+d.cl.length+'</span></div>'+
        '<div class="pbar"><div class="pfill" id="pf'+d.id+'" style="background:'+d.dc+';width:0%"></div></div>'+
        '<div class="cl">'+clH+'</div>'+
      '</div>'+
      (d.warn?'<div class="warn">'+d.warn+'</div>':'')+
      '<div class="tip"><strong>💡 </strong>'+d.tip+'</div>'+
    '</div>'+
  '</div>';
}

var h="";for(var i=0;i<days.length;i++)h+=renderDay(days[i]);
document.getElementById("root").innerHTML=h;
